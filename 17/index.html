<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Exercício - Galeria de Imagens (Bootstrap)</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container conteudo">

        <div class="row linha">

            <div class="col-md-6 coluna">
                <img src="https://picsum.photos/id/1015/500/650" alt="Imagem 1" class="img-responsive imagem imagem-grande">
            </div>

            <div class="col-md-6 coluna">

                <div class="row linha">
                    <div class="col-md-12 coluna">
                        <img src="https://picsum.photos/id/1016/500/220" alt="Imagem 2" class="img-responsive imagem">
                    </div>
                </div>

                <div class="row linha">
                    <div class="col-md-6 coluna">
                        <img src="https://picsum.photos/id/1018/250/200" alt="Imagem 3" class="img-responsive imagem">
                    </div>
                    <div class="col-md-6 coluna">
                        <img src="https://picsum.photos/id/1019/250/200" alt="Imagem 4" class="img-responsive imagem">
                    </div>
                </div>

                <div class="row linha">
                    <div class="col-md-4 coluna">
                        <img src="https://picsum.photos/id/1020/170/170" alt="Imagem 5" class="img-responsive imagem">
                    </div>
                    <div class="col-md-4 coluna">
                        <img src="https://picsum.photos/id/1021/170/170" alt="Imagem 6" class="img-responsive imagem">
                    </div>
                    <div class="col-md-4 coluna">
                        <img src="https://picsum.photos/id/1024/170/170" alt="Imagem 7" class="img-responsive imagem">
                    </div>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
